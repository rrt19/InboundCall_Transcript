<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kyron Medical - Transcript Viewer{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #E7F0FA 0%, #ffffff 100%); min-height: 100vh; color: #1E2A36; }
        .header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #E7F0FA; padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px rgba(76, 130, 224, 0.08); }
        .header-content { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
        .logo-icon { width: 40px; height: 40px; }
        .logo-text { font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, #4C82E0 0%, #2E4C9E 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .nav { display: flex; gap: 1.5rem; align-items: center; }
        .nav a { color: #4B5B67; text-decoration: none; font-weight: 500; transition: color 0.3s; }
        .nav a:hover { color: #4C82E0; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .footer { background: #2E4C9E; color: white; text-align: center; padding: 2rem; margin-top: 4rem; }
        .footer-text { opacity: 0.9; }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo">
                <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="18" fill="url(#grad1)" />
                    <path d="M20 8 L28 14 L28 26 L20 32 L12 26 L12 14 Z" fill="white" fill-opacity="0.9"/>
                    <circle cx="20" cy="20" r="4" fill="#4C82E0"/>
                    <defs><linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4C82E0"/><stop offset="100%" style="stop-color:#2E4C9E"/></linearGradient></defs>
                </svg>
                <span class="logo-text">Kyron Medical</span>
            </a>
            <nav class="nav">
                <a href="/">Transcripts</a>
                <a href="/">Dashboard</a>
            </nav>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <p class="footer-text">Powered by Kyron Medical | Patient-Assistant Transcript Management System</p>
    </footer>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
